services:

  # ── RabbitMQ ────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ikr-rabbitmq
    ports:
      - "5672:5672"       # AMQP
      - "15672:15672"     # Management UI → http://localhost:15672 (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── PostgreSQL: registration ────────────────────────────────────────────────
  postgres-registration:
    image: postgres:16-alpine
    container_name: ikr-postgres-registration
    environment:
      POSTGRES_DB: registration_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"       # lokaal poort 5433 om conflict te vermijden
    volumes:
      - postgres_registration_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d registration_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── PostgreSQL: schedule ─────────────────────────────────────────────────────
  postgres-schedule:
    image: postgres:16-alpine
    container_name: ikr-postgres-schedule
    environment:
      POSTGRES_DB: schedule_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"       # lokaal poort 5434
    volumes:
      - postgres_schedule_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d schedule_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Registration Service ─────────────────────────────────────────────────────
  registration:
    build:
      context: ./registration-service
      dockerfile: Dockerfile
    container_name: ikr-registration
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres-registration
      DB_PORT: 5432
      DB_NAME: registration_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      postgres-registration:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: on-failure

  # ── Schedule Service ─────────────────────────────────────────────────────────
  schedule:
    build:
      context: ./schedule-service
      dockerfile: Dockerfile
    container_name: ikr-schedule
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres-schedule
      DB_PORT: 5432
      DB_NAME: schedule_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      postgres-schedule:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: on-failure

volumes:
  postgres_registration_data:
  postgres_schedule_data:
