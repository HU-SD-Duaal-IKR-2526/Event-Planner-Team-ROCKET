server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: core-monolith

  # ── PostgreSQL — shared Core DB (schema-per-module) ────────────
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5433}/${PG_DB:eventplanner}
    username: ${PG_USER:core}
    password: ${PG_PASS:core}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

  # ── MongoDB — User/Profile module ──────────────────────────────
  data:
    mongodb:
      uri: mongodb://root:root@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:userprofile}?authSource=admin
      auto-index-creation: true

  # ── RabbitMQ ───────────────────────────────────────────────────
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:ep}
    password: ${RABBIT_PASS:ep}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10

# ── App-specific ──────────────────────────────────────────────────
app:
  identity:
    # RSA public key fetched once at startup from Identity service JWKS endpoint.
    # Tokens verified locally — no per-request call to Identity.
    jwks-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
  storage:
    # S3-compatible Object Storage for avatars (Context Map §6.3)
    # Replace with real AWS credentials in production
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:eventplanner-avatars}
    base-url: ${S3_BASE_URL:http://localhost:9000/eventplanner-avatars}

# ── Actuator ──────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0

# ── Logging ───────────────────────────────────────────────────────
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"
  level:
    com.zaxxer.hikari: DEBUG
    nl.teamrocket: DEBUG
    org.springframework.security: INFO
    org.springframework.amqp: INFO

