name: CI

on:
  pull_request:
    branches:
      - main
      - dev

jobs:

  lint:
    name: Checkstyle
    runs-on: ubuntu-latest
    # Advisory zolang de modules de gedeelde checkstyle.xml nog niet volgen
    # (o.a. star-imports in bestaande code). Zet continue-on-error op false
    # zodra de violations per module zijn weggewerkt.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Checkstyle (alle modules, gedeelde config)
        run: >
          mvn checkstyle:check --batch-mode --no-transfer-progress
          -Dcheckstyle.config.location=${{ github.workspace }}/checkstyle.xml

  test:
    name: Tests (alle modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: mvn verify --batch-mode --no-transfer-progress -Dcheckstyle.skip=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/target/surefire-reports/'
          retention-days: 7

  docker-build:
    name: Docker images bouwen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build alle images via compose
        run: docker compose build
